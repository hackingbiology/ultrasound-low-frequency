<figure class="diag" id="diag-b">
<svg viewBox="0 0 880 360" role="img" aria-label="Block diagram of architecture B: an open low-power driver chain from microcontroller to Langevin transducer with resonance tracking and hydrophone feedback">
  <defs><marker id="ah2" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto"><polygon class="arrowhead" points="0 0, 9 3.5, 0 7"/></marker></defs>
  <text class="h" x="8" y="18">B · Open driver + Langevin transducer</text>

  <rect class="bx t" x="8" y="40" width="140" height="92" rx="6"/><text x="20" y="64">MCU</text><text class="s" x="20" y="84">RP2040 / STM32</text><text class="s" x="20" y="100">DDS or PWM 32.2 kHz</text><text class="s" x="20" y="116">sweep ±0.5 kHz, gating</text>
  <line class="ln" x1="148" y1="86" x2="186" y2="86" marker-end="url(#ah2)"/>
  <rect class="bx" x="186" y="40" width="140" height="92" rx="6"/><text x="198" y="64">Gate driver</text><text class="s" x="198" y="84">IR2184 / UCC27201</text><text class="s" x="198" y="100">dead-time control</text>
  <line class="ln" x1="326" y1="86" x2="364" y2="86" marker-end="url(#ah2)"/>
  <rect class="bx" x="364" y="40" width="150" height="92" rx="6"/><text x="376" y="64">Half/full bridge</text><text class="s" x="376" y="84">MOSFETs, 24–48 V rail</text><text class="s" x="376" y="100">only a few watts needed</text><text class="s" x="376" y="116">(class-D module option)</text>
  <line class="ln" x1="514" y1="86" x2="552" y2="86" marker-end="url(#ah2)"/>
  <rect class="bx" x="552" y="40" width="150" height="92" rx="6"/><text x="564" y="64">Matching network</text><text class="s" x="564" y="84">series L + transformer</text><text class="s" x="564" y="100">tunes out C₀ of the PZT</text>
  <line class="ln" x1="702" y1="86" x2="740" y2="86" marker-end="url(#ah2)"/>
  <rect class="bx a" x="740" y="40" width="130" height="92" rx="6"/><text x="752" y="64">Langevin</text><text class="s" x="752" y="84">33 kHz bolt-clamped</text><text class="s" x="752" y="100">potted / submersible</text><text class="s" x="752" y="116">≈ €10–60</text>

  <rect class="water" x="552" y="180" width="318" height="120" rx="6"/><text x="566" y="204">Tank: 4 L beaker → foot bath</text><text class="s" x="566" y="224">degassed water, 32–35 °C</text><text class="s" x="566" y="242">target 7–10 cm above the face</text><text class="s" x="566" y="260">absorber lining to damp reflections</text><text class="s" x="566" y="280">acceptance test: 4–8 kPa ±25%</text>
  <line class="ln" x1="805" y1="132" x2="805" y2="180" marker-end="url(#ah2)"/>

  <rect class="bx u" x="330" y="180" width="190" height="120" rx="6"/><text x="344" y="204">Measurement</text><text class="s" x="344" y="224">V and I sense → impedance</text><text class="s" x="344" y="242">resonance tracking (PLL)</text><text class="s" x="344" y="260">hydrophone → kPa</text><text class="s" x="344" y="278">spectrum → cavitation</text>
  <line class="ln" x1="552" y1="240" x2="520" y2="240" marker-end="url(#ah2)"/>
  <line class="ln t d" x1="330" y1="222" x2="78" y2="222"/><line class="ln t d" x1="78" y1="222" x2="78" y2="132" marker-end="url(#ah2)"/>
  <text class="s" x="92" y="160">closed loop: amplitude + frequency</text>

  <rect class="bx" x="8" y="180" width="200" height="120" rx="6"/><text x="20" y="204">Firmware + host</text><text class="s" x="20" y="224">MicroPython / C, USB CLI</text><text class="s" x="20" y="242">session recipe as a file</text><text class="s" x="20" y="260">CSV log + calibration table</text><text class="s" x="20" y="278">open schematics (KiCad)</text>
</svg>
<figcaption>B · Everything is ours and everything is documented: exact pulse timing, sweep, resonance tracking, and a calibration table linking drive amplitude to measured kPa. This is the architecture that a second builder can reproduce most faithfully.</figcaption>
</figure>
