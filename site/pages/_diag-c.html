<figure class="diag" id="diag-c">
<svg viewBox="0 0 880 380" role="img" aria-label="Block diagram of architecture C: a multi-channel transducer array around a bathtub with safety systems">
  <defs><marker id="ah3" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto"><polygon class="arrowhead" points="0 0, 9 3.5, 0 7"/></marker></defs>
  <text class="h" x="8" y="18">C · Multi-channel array tub (human immersion)</text>

  <rect class="bx r" x="8" y="40" width="210" height="130" rx="6"/><text x="20" y="64">Electrical safety layer</text><text class="s" x="20" y="84">medical isolation transformer</text><text class="s" x="20" y="102">RCD 10 mA + IMD</text><text class="s" x="20" y="120">all-plastic tub, no earthed metal</text><text class="s" x="20" y="138">leakage test before each session</text><text class="s" x="20" y="156">emergency stop within reach</text>

  <rect class="bx t" x="250" y="40" width="190" height="130" rx="6"/><text x="262" y="64">Controller</text><text class="s" x="262" y="84">SBC + N×MCU channels</text><text class="s" x="262" y="102">per-channel amplitude</text><text class="s" x="262" y="120">phase / sequencing groups</text><text class="s" x="262" y="138">sweep 32.2 ± 0.5 kHz</text><text class="s" x="262" y="156">watchdog, interlocks</text>
  <line class="ln" x1="218" y1="105" x2="250" y2="105" marker-end="url(#ah3)"/>
  <line class="ln" x1="440" y1="105" x2="472" y2="105" marker-end="url(#ah3)"/>
  <rect class="bx" x="472" y="40" width="170" height="130" rx="6"/><text x="484" y="64">8–16 driver channels</text><text class="s" x="484" y="84">one B-stage per channel</text><text class="s" x="484" y="102">galvanically isolated</text><text class="s" x="484" y="120">current monitoring per ch.</text><text class="s" x="484" y="138">≈ 1–5 W each</text>

  <rect class="water" x="250" y="210" width="392" height="150" rx="10"/>
  <text x="264" y="234">Bathtub · degassed water 32–35 °C</text>
  <text class="s" x="264" y="252">subject seated, head out of water</text>
  <text class="s" x="264" y="270">field map per body position → channel table</text>
  <g>
    <rect class="bx a" x="272" y="290" width="46" height="26" rx="4"/><rect class="bx a" x="330" y="290" width="46" height="26" rx="4"/><rect class="bx a" x="388" y="290" width="46" height="26" rx="4"/><rect class="bx a" x="446" y="290" width="46" height="26" rx="4"/><rect class="bx a" x="504" y="290" width="46" height="26" rx="4"/><rect class="bx a" x="562" y="290" width="46" height="26" rx="4"/>
    <text class="s" x="284" y="307">T1</text><text class="s" x="342" y="307">T2</text><text class="s" x="400" y="307">T3</text><text class="s" x="458" y="307">T4</text><text class="s" x="516" y="307">T5</text><text class="s" x="574" y="307">Tn</text>
    <text class="s" x="272" y="338">potted transducers on arms / walls, individually driven and sequenced</text>
  </g>
  <line class="ln" x1="557" y1="170" x2="557" y2="210" marker-end="url(#ah3)"/>

  <rect class="bx u" x="674" y="40" width="196" height="130" rx="6"/><text x="686" y="64">Monitoring</text><text class="s" x="686" y="84">water temperature ×2</text><text class="s" x="686" y="102">leakage current, live</text><text class="s" x="686" y="120">cavitation sensor</text><text class="s" x="686" y="138">session timer + log</text><text class="s" x="686" y="156">operator present, always</text>
  <line class="ln" x1="674" y1="105" x2="642" y2="105" marker-end="url(#ah3)"/>
  <rect class="bx" x="674" y="210" width="196" height="150" rx="6"/><text x="686" y="234">Field calibration rig</text><text class="s" x="686" y="254">3-axis gantry (3-D printer)</text><text class="s" x="686" y="272">hydrophone traverse</text><text class="s" x="686" y="290">map before first human use</text><text class="s" x="686" y="308">repeat if anything changes</text><text class="s" x="686" y="326">publish the map with</text><text class="s" x="686" y="344">every build</text>
  <line class="ln" x1="674" y1="285" x2="642" y2="285" marker-end="url(#ah3)"/>
</svg>
<figcaption>C · Many weak, individually controlled sources beat one strong one: it flattens the field and lowers the pressure anywhere near a transducer. The hard parts are electrical safety in water and mapping a field around a human body.</figcaption>
</figure>
